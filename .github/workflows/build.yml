# Automatischer Windows-Build für StemMaker, StemCLI, StemPlayer und die
# Test-AddOns (StemDecks, Stem51, TurboTest, StemTagger).
#
# Was passiert wann:
# - Jeder Pull Request und jeder Push auf main baut die Exes auf einem
#   Windows-Rechner von GitHub. Fehler im Quelltext fallen so sofort auf.
# - Die Exes landen nur als Workflow-Artefakt beim Build-Lauf (privat, nur mit
#   GitHub-Login, 14 Tage). Testversionen werden NICHT mehr als Vor-Release
#   (test-main, test-pr-N) veröffentlicht. Sie kommen gezippt mit Anleitung in
#   den privaten Projektordner.
# - Alte Vor-Releases mit Tag "test-..." aus der Zeit davor löscht der Job
#   "aufraeumen" bei jedem Push auf main und beim Schliessen eines PRs.
#
# Details: docs/TESTVERSIONEN.md

name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:

# Schreibrecht auf "contents" braucht es nur noch, um alte Vor-Releases zu löschen.
permissions:
  contents: write

# Pro Branch bzw. PR immer nur ein Lauf; ein neuer Push bricht den alten Lauf ab.
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Lazarus-Version für den Build (FPC 3.2.2 ist dabei)
  LAZARUS_VERSION: "3.8"

jobs:
  stemonnx:
    # Turbo-Engine (engines/onnx) auf Linux mit mingw, kommt als tools\onnx\
    # mit ins Artefakt
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
      - name: mingw installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64-posix
      - name: StemOnnx bauen
        run: engines/onnx/build.sh
      - name: Paket weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: StemOnnx-build-${{ github.sha }}
          path: engines/onnx/dist/StemOnnx
          retention-days: 3

  build:
    # Beim Schliessen eines PRs wird nicht gebaut, nur aufgeräumt (Job "aufraeumen")
    if: github.event.action != 'closed'
    needs: stemonnx
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Versionen prüfen
        # Quelltext, Exe-Versionsinfo (.lpi) und LIESMICH/README müssen dieselbe
        # Version nennen, bei StemMaker und allen AddOns
        run: installer/versionen-pruefen.sh

      - name: Lazarus installieren
        # Fremde Action: auf einen festen Commit gepinnt (= Tag v3.4.1), nicht auf
        # "v3". Ein Tag kann der Autor jederzeit verschieben, und dieser Job läuft
        # mit Schreibrecht auf das Repository. Neue Version: Commit-SHA des Tags
        # nachschlagen und hier eintragen.
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: Exes bauen
        run: |
          set -e
          # -B = alle Units des Projekts neu übersetzen (kein alter Stand aus einem Cache)
          for lpi in src/StemMaker.lpi src/StemCLI.lpi src/AddOns/StemPlayer/StemPlayer.lpi src/AddOns/StemDecks/StemDecks.lpi src/AddOns/StemDecks/Stem51.lpi src/AddOns/TurboTest/TurboTest.lpi src/AddOns/StemTagger/StemTagger.lpi; do
            echo "::group::$lpi"
            lazbuild -B --os=win64 --cpu=x86_64 --ws=win32 "$lpi"
            echo "::endgroup::"
          done

      - name: Exes einsammeln, verkleinern und Prüfsummen bilden
        run: |
          set -e
          mkdir -p ausgabe
          cp bin/StemMaker.exe bin/StemCLI.exe src/AddOns/StemPlayer/StemPlayer.exe src/AddOns/StemDecks/StemDecks.exe src/AddOns/StemDecks/Stem51.exe src/AddOns/TurboTest/StemMaker-Turbo-Test.exe src/AddOns/StemTagger/StemTagger.exe ausgabe/

          # Debug-Infos entfernen (StemMaker: ca. 29 MB -> 3,5 MB). Es fehlen dann
          # nur die Zeilennummern im Absturz-Log. strip.exe liegt bei FPC dabei.
          STRIP=$(find /c/lazarus -iname strip.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$STRIP" ]; then STRIP=$(command -v strip || true); fi
          if [ -n "$STRIP" ]; then
            echo "strip: $STRIP"
            "$STRIP" ausgabe/*.exe
          else
            echo "::warning::strip.exe nicht gefunden, Exes bleiben gross"
          fi

          cd ausgabe
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          ls -l

      - name: Setup bauen und testen (Testversion)
        # Das Setup braucht den ganzen Programmordner (demucs, Sprachdateien ...).
        # Dafür nehmen wir das aktuelle Release-ZIP aus update.json (Prüfsumme wird
        # kontrolliert) und ersetzen darin die Exes durch die frisch gebauten.
        run: |
          set -e
          read -r VERSION URL SHA < <(python -c "import json; d=json.load(open('update.json', encoding='utf-8')); print(d['version'], d['zip_url'], d['zip_sha256'])" | tr -d '\r')
          curl -sSfL -o release.zip "$URL"
          echo "$SHA  release.zip" | sha256sum -c -
          bash installer/setup-bauen.sh release.zip "$VERSION-test" StemMaker-Setup-Test ausgabe
          pwsh -File installer/setup-testen.ps1 installer/Output/StemMaker-Setup-Test.exe
          cp installer/Output/StemMaker-Setup-Test.exe ausgabe/
          (cd ausgabe && sha256sum StemMaker-Setup-Test.exe >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Download-ZIP für das Test-Tool "5.1 -> Stem" bauen
        # Komplettes ZIP für Leute ohne StemMaker: Stem51.exe, Anleitung DE/EN,
        # ffmpeg (LGPL, aus unserem Release) und eine kleine 5.1-Testdatei.
        run: |
          set -e
          VER=$(sed -n "s/^ *APP_VER *= *'\(.*\)';.*/\1/p" src/AddOns/StemDecks/stem51form.pas | head -n 1 | tr -d '\r')
          bash src/AddOns/StemDecks/stem51-zip.sh ausgabe/Stem51.exe "$VER" ausgabe
          (cd ausgabe && sha256sum Elospeed-5.1-Stem-*.zip >> SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Turbo (StemOnnx) holen
        uses: actions/download-artifact@v4
        with:
          name: StemOnnx-build-${{ github.sha }}
          path: ausgabe/onnx

      - name: Exes als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@v4
        with:
          name: StemMaker-Win64-${{ github.sha }}
          path: ausgabe/
          retention-days: 14

  aufraeumen:
    # Alte Test-Vor-Releases (Tags "test-...") entfernen: bei jedem Push auf main
    # und nach dem Schliessen oder Mergen eines PRs. Offizielle Releases (v1.7 usw.)
    # sind keine Vor-Releases und beginnen nicht mit "test-", bleiben also unberührt.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Test-Vor-Releases löschen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          # Nur Releases, die Vor-Release sind UND deren Tag mit "test-" beginnt
          gh release list --repo "$REPO" --limit 200 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("test-"))) | .tagName' |
          while read -r TAG; do
            echo "Lösche $TAG"
            gh release delete "$TAG" --cleanup-tag --yes --repo "$REPO" || true
          done
