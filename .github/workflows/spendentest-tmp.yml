# Vorübergehend: Spenden-Hinweis auf Windows zeigen und fotografieren.
# Wird nach dem Test wieder entfernt.
name: Spendentest (vorübergehend)
on:
  push:
    branches: [elospeed/spenden-hinweis-gmlw6m]
    paths: [tmp-spendentest/**, .github/workflows/spendentest-tmp.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: "3.8"
          with-cache: false
      - name: Bauen
        run: lazbuild -B --os=win64 --cpu=x86_64 --ws=win32 tmp-spendentest/spendentest.lpi
      - name: Laufen (DE und EN)
        run: |
          cd tmp-spendentest
          mkdir -p lang && cp ../src/lang/*.po lang/
          ./spendentest.exe de
          rm -f StemMaker.ini
          ./spendentest.exe en
          ls -la *.png
      - name: Fotos ins Log (Base64)
        run: |
          cd tmp-spendentest
          for f in *.png; do echo "=== BEGIN $f"; base64 -w 900 "$f" | sed 's/^/B64 /'; echo "=== END $f"; done
