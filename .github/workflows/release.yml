# Release erstellen: ein Klick statt ZIP von Hand bauen und hochladen.
#
# So geht's: Actions -> "Release erstellen" -> Run workflow -> Version eintragen
# (z. B. 1.7.2, ohne "v"). Vorher muss auf main schon alles für diese Version
# drin sein: APP_VERSION in src/version.inc, die Versionsinfo in src/StemMaker.lpi
# und src/StemCLI.lpi
# (Projekt -> Projektoptionen -> Versionsinfo) und ein Abschnitt "## <Version> – ..."
# im CHANGELOG, dazu je ein kurzer Abschnitt in src/versionen/de.md, en.md und es.md
# (Reiter "Versionen" im Info-Fenster).
#
# Was passiert:
# 1. Prüfen: Version passt zu APP_VERSION, CHANGELOG und src/versionen/*.md haben
#    den Abschnitt, Tag gibt es noch nicht.
# 2. StemMaker, StemCLI und StemPlayer bauen (wie build.yml), dazu Turbo
#    (StemOnnx, engines/onnx) im Job "stemonnx" auf Linux mit mingw.
# 3. Release-ZIP zusammenstellen (installer/release-zip.sh). Die Teile, die nicht
#    im Repository liegen (demucs.cpp in tools\), kommen aus dem letzten
#    Release-ZIP laut update.json, mit Prüfsummen-Kontrolle.
# 4. Release v<Version> anlegen, Text = CHANGELOG-Abschnitt + SHA-256, ZIP dran.
# 5. Workflow "Setup zum Release" starten, der hängt die Setup-Exe an.
#    (Ein Release, das ein Workflow anlegt, löst "release: published" nicht aus,
#    deshalb wird er hier ausdrücklich gestartet.)
#
# update.json wird NICHT geändert. Die nötigen Werte stehen in der Zusammenfassung
# des Laufs; erst wenn das Release online ist, kommt update.json per PR nach.

name: Release erstellen

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z. B. 1.7.2"
        required: true

permissions:
  contents: write   # Release anlegen und ZIP hochladen
  actions: write    # Workflow "Setup zum Release" starten

concurrency:
  group: release
  cancel-in-progress: false

env:
  LAZARUS_VERSION: "3.8"

jobs:
  stemonnx:
    # Turbo-Engine: baut StemOnnx.exe und holt ONNX Runtime + DirectML
    # (feste Versionen mit Prüfsumme, siehe engines/onnx/build.sh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
      - name: mingw installieren
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64-posix
      - name: StemOnnx bauen
        run: engines/onnx/build.sh
      - name: Paket weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: StemOnnx-release
          path: engines/onnx/dist/StemOnnx
          retention-days: 3

  handbuch:
    # Benutzerhandbuch DE/EN/ES als PDF (docs/handbuch/build.py), kommt mit
    # auf die Release-Seite. Dieselben PDFs baut pages.yml für die Projektseite.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4
      - name: Handbuch bauen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc poppler-utils fonts-crosextra-carlito fonts-dejavu-core
          python3 docs/handbuch/build.py --out handbuch
          ls -l handbuch
      - name: Handbuch weitergeben
        uses: actions/upload-artifact@v4
        with:
          name: Handbuch
          path: handbuch/*.pdf
          retention-days: 3

  release:
    needs: [stemonnx, handbuch]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Version prüfen
        # Version kommt über eine Umgebungsvariable ins Skript, nicht direkt per ${{ }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION=$(printf '%s' "$VERSION" | tr -d ' \r')
          VERSION="${VERSION#v}"
          echo "$VERSION" | grep -qE '^[0-9]+(\.[0-9]+)+$' || { echo "::error::Version '$VERSION' ist keine Versionsnummer wie 1.7.2"; exit 1; }
          APP=$(sed -n "s/^ *APP_VERSION *= *'\(.*\)';.*/\1/p" src/version.inc | head -n 1 | tr -d '\r')
          [ "$APP" = "$VERSION" ] || { echo "::error::src/version.inc hat APP_VERSION '$APP', nicht '$VERSION'"; exit 1; }
          # Versionsinfo der Exe (Eigenschaften -> Details) muss dazu passen
          for LPI in src/StemMaker.lpi src/StemCLI.lpi; do
            grep -q "ProductVersion=\"$VERSION\"" "$LPI" || { echo "::error::$LPI hat nicht ProductVersion=\"$VERSION\""; exit 1; }
          done
          grep -q "^## $VERSION " CHANGELOG.md || { echo "::error::Im CHANGELOG fehlt der Abschnitt '## $VERSION – ...'"; exit 1; }
          # Kurzfassung für den Reiter "Versionen" im Info-Fenster, in allen drei Sprachen
          for V in src/versionen/de.md src/versionen/en.md src/versionen/es.md; do
            grep -q "^## $VERSION " "$V" || { echo "::error::In $V fehlt der Abschnitt '## $VERSION – ...'"; exit 1; }
          done
          if gh release view "v$VERSION" --repo "$REPO" > /dev/null 2>&1; then
            echo "::error::Release v$VERSION gibt es schon"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Lazarus installieren
        # gleicher gepinnter Commit wie in build.yml (= Tag v3.4.1)
        uses: gcarreno/setup-lazarus@3ee9d77e0c771b37c1069f218cb68bd5ce7c30fe # v3.4.1
        with:
          lazarus-version: ${{ env.LAZARUS_VERSION }}
          with-cache: false

      - name: Exes bauen und verkleinern
        run: |
          set -e
          for lpi in src/StemMaker.lpi src/StemCLI.lpi src/AddOns/StemPlayer/StemPlayer.lpi; do
            echo "::group::$lpi"
            lazbuild -B --os=win64 --cpu=x86_64 --ws=win32 "$lpi"
            echo "::endgroup::"
          done
          mkdir -p exes
          cp bin/StemMaker.exe bin/StemCLI.exe src/AddOns/StemPlayer/StemPlayer.exe exes/
          STRIP=$(find /c/lazarus -iname strip.exe 2>/dev/null | head -n 1 || true)
          if [ -z "$STRIP" ]; then STRIP=$(command -v strip || true); fi
          [ -n "$STRIP" ] || { echo "::error::strip.exe nicht gefunden"; exit 1; }
          "$STRIP" exes/*.exe
          ls -l exes

      - name: Turbo (StemOnnx) holen
        uses: actions/download-artifact@v4
        with:
          name: StemOnnx-release
          path: stemonnx

      - name: Handbuch (PDF) holen
        uses: actions/download-artifact@v4
        with:
          name: Handbuch
          path: handbuch

      - name: Release-ZIP zusammenstellen
        run: |
          set -e
          read -r URL SHA < <(python -c "import json; d=json.load(open('update.json', encoding='utf-8')); print(d['zip_url'], d['zip_sha256'])" | tr -d '\r')
          curl -sSfL -o alt.zip "$URL"
          echo "$SHA  alt.zip" | sha256sum -c -
          bash installer/release-zip.sh alt.zip exes "$VERSION" ausgabe stemonnx
          ZIPSHA=$(sha256sum "ausgabe/StemMaker-$VERSION.zip" | cut -d' ' -f1)
          echo "ZIPSHA=$ZIPSHA" >> "$GITHUB_ENV"

      - name: Release anlegen und ZIP hochladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          # Release-Text: der CHANGELOG-Abschnitt dieser Version (ohne Überschrift)
          python - "$VERSION" > notizen.md <<'PY'
          import sys
          v = sys.argv[1]
          zeilen = open('CHANGELOG.md', encoding='utf-8').read().splitlines()
          drin, aus = False, []
          for z in zeilen:
              if z.startswith('## '):
                  if drin:
                      break
                  drin = z.startswith('## ' + v + ' ')
                  continue
              if drin:
                  aus.append(z)
          sys.stdout.reconfigure(encoding='utf-8')
          print('\n'.join(aus).strip())
          PY
          {
            echo
            echo "StemMaker ab 1.7 bietet dieses Update beim nächsten Start an. / StemMaker 1.7 and later offer this update on the next start."
            echo
            echo "Handbuch / Manual / Manual (PDF): \`StemMaker-Handbuch-de.pdf\` · \`-en.pdf\` · \`-es.pdf\`"
            echo
            echo "Alle Änderungen / All changes: [CHANGELOG](https://github.com/$REPO/blob/main/CHANGELOG.md)"
            echo
            echo "SHA-256 \`StemMaker-$VERSION.zip\`: \`$ZIPSHA\`"
          } >> notizen.md
          gh release create "v$VERSION" "ausgabe/StemMaker-$VERSION.zip" handbuch/*.pdf --repo "$REPO" \
            --target "$GITHUB_SHA" --title "StemMaker $VERSION" --notes-file notizen.md --latest

      - name: Setup zum Release starten
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: gh workflow run setup.yml --repo "$REPO" --ref main -f tag="v$VERSION"

      - name: Zusammenfassung
        run: |
          {
            echo "### Release v$VERSION angelegt"
            echo "SHA-256 \`StemMaker-$VERSION.zip\`: \`$ZIPSHA\`"
            echo
            echo "Die Setup-Exe hängt der Workflow \"Setup zum Release\" an (läuft gleich danach)."
            echo
            echo "Danach update.json per PR nachführen:"
            echo '```'
            echo "\"version\": \"$VERSION\","
            echo "\"zip_url\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/StemMaker-$VERSION.zip\","
            echo "\"zip_sha256\": \"$ZIPSHA\""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
